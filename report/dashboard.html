<title>GramUrja Operations Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #F2F6F8; --surface: #FCFCFB; --surface-2: #FFFFFF; --sunk: #E9EFF3;
    --ink: #101820; --ink-2: #4B5B65; --ink-3: #6F808B;
    --rule: #D6E0E7; --rule-2: #B4C4CF;
    --accent: #0E6470; --accent-soft: #DEEEF0; --good: #1B7F4E; --warn: #A2452C;
    /* Series slots validated against #fcfcfb via validate_palette.js (light mode) */
    --s-ag: #2a78d6; --s-diesel: #eb6834; --s-batt: #1baf7a; --s-solar: #eda100; --s-village: #e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0B1016; --surface: #1A1A19; --surface-2: #141C24; --sunk: #202A33;
      --ink: #EAF1F6; --ink-2: #A9BAC6; --ink-3: #7C8D99;
      --rule: #26323C; --rule-2: #384856;
      --accent: #49B3C0; --accent-soft: #143034; --good: #5CB98C; --warn: #D97B5C;
      --s-ag: #3987e5; --s-diesel: #d95926; --s-batt: #199e70; --s-solar: #c98500; --s-village: #d55181;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0B1016; --surface: #1A1A19; --surface-2: #141C24; --sunk: #202A33;
    --ink: #EAF1F6; --ink-2: #A9BAC6; --ink-3: #7C8D99;
    --rule: #26323C; --rule-2: #384856;
    --accent: #49B3C0; --accent-soft: #143034; --good: #5CB98C; --warn: #D97B5C;
    --s-ag: #3987e5; --s-diesel: #d95926; --s-batt: #199e70; --s-solar: #c98500; --s-village: #d55181;
  }

  body { background: var(--ground); color: var(--ink);
         font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px; line-height: 1.5;
         -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 72px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
           gap: 12px; padding: 28px 0 16px; border-bottom: 2px solid var(--ink); margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .spec { display: flex; gap: 18px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-2); }
  .spec b { color: var(--ink); font-weight: 600; }

  .tiles { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule);
           grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 26px; }
  .tile { background: var(--surface-2); padding: 16px 16px 14px; }
  .tile .lab { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .tile .big { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
               font-size: 27px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; }
  .tile .big span { font-size: 14px; font-weight: 400; color: var(--ink-2); }
  .tile .sub2 { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-2); margin-top: 7px; }
  .tile .sub2 b { color: var(--good); font-weight: 500; }

  section.panel { background: var(--surface-2); border: 1px solid var(--rule);
                  padding: 18px 18px 14px; margin-bottom: 22px; }
  .ptitle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .ptitle h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .ptitle .note { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-3); }
  .pdesc { font-size: 12.5px; color: var(--ink-2); margin: 0 0 14px; max-width: 78ch; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 10px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .sw { width: 11px; height: 11px; border-radius: 2px; flex: none; }

  .chartbox { position: relative; overflow-x: auto; }
  svg.chart { display: block; width: 100%; height: auto; }
  .gridline { stroke: var(--rule); stroke-width: 1; }
  .axis { stroke: var(--rule-2); stroke-width: 1; }
  .tick { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--ink-3); }
  .alab { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--ink-3); letter-spacing: 0.06em; }
  .dlab { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 500; }

  .tip { position: absolute; pointer-events: none; background: var(--surface);
         border: 1px solid var(--rule-2); padding: 8px 10px;
         font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink);
         box-shadow: 0 4px 14px rgba(0,0,0,.14); min-width: 152px; z-index: 5; }
  .tip .th { font-weight: 600; margin-bottom: 5px; }
  .tip .r { display: flex; justify-content: space-between; gap: 12px; }
  .tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }
  .tip .r .v { font-variant-numeric: tabular-nums; }

  .two { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th { text-align: left; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
       color: var(--ink-3); padding: 7px 10px; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
  td { padding: 6px 10px; border-bottom: 1px solid var(--rule); }
  th.n, td.n { text-align: right; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  tr.hi td { background: var(--accent-soft); font-weight: 600; }

  details { margin-top: 12px; }
  summary { cursor: pointer; font-size: 12px; color: var(--accent); padding: 5px 0; }
  summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabscroll { overflow: auto; max-height: 340px; margin-top: 8px; border: 1px solid var(--rule); }

  .brief { background: var(--sunk); border-left: 3px solid var(--accent); padding: 13px 15px; }
  .brief ul { margin: 0; padding-left: 18px; }
  .brief li { margin-bottom: 5px; font-size: 13px; }
  .brief li:last-child { margin-bottom: 0; }

  footer { border-top: 1px solid var(--rule); padding-top: 14px; margin-top: 6px;
           font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-3); }
</style>

<script>
/* React via createElement rather than JSX: in-browser Babel needs eval-like script
   injection that the artifact CSP may refuse, and a 2 MB transpiler is poor value here.
   Components, hooks and declarative SVG are unaffected. */
(function () {
  "use strict";
  const { createElement: h, useState, useMemo, useRef, useCallback, Fragment } = React;
  const D = JSON.parse(document.getElementById("data").textContent);

  const fmt = (v, d = 0) => v.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
  const pad = (n) => String(n).padStart(2, "0");

  /* Stack order is the adjacency order that cleared validate_palette.js in BOTH modes.
     Each slot is also semantically apt, and identity never rests on colour alone -
     a legend, direct labels and the hourly table all carry it. */
  const SERIES = [
    { key: "ag_kw",        label: "Agricultural feeder", v: "--s-ag" },
    { key: "diesel_kw",    label: "Diesel",              v: "--s-diesel" },
    { key: "discharge_kw", label: "Battery discharge",   v: "--s-batt" },
    { key: "solar_kw",     label: "Solar",               v: "--s-solar" },
    { key: "village_kw",   label: "Village feeder",      v: "--s-village" }
  ];

  const W = D.week;
  const N = W.hour.length;
  const dayOf = (i) => D.week.start_day + Math.floor(i / 24);
  const stamp = (i) => "Day " + dayOf(i) + ", " + pad(i % 24) + ":00";

  /* ---------- small shared pieces ---------- */

  function Panel({ title, note, desc, children }) {
    return h("section", { className: "panel" },
      h("div", { className: "ptitle" },
        h("h2", null, title),
        note && h("span", { className: "note" }, note)),
      desc && h("p", { className: "pdesc" }, desc),
      children);
  }

  function Tip({ at, children }) {
    if (!at) return null;
    return h("div", { className: "tip", style: { left: at.left + "px", top: at.top + "px" } }, children);
  }

  function Row({ swatch, name, value }) {
    return h("div", { className: "r" },
      h("span", null, swatch && h("i", { style: { background: "var(" + swatch + ")" } }), name),
      h("span", { className: "v" }, value));
  }

  /* Track the pointer against an svg's own viewBox width, so hit-testing stays
     correct however the chart is scaled by CSS. */
  function usePointerIndex(vbWidth, left, plotWidth, count) {
    const ref = useRef(null);
    const [state, setState] = useState(null);
    const onMove = useCallback((ev) => {
      const r = ref.current.getBoundingClientRect();
      const px = ((ev.clientX - r.left) / r.width) * vbWidth;
      let i = Math.round(((px - left) / plotWidth) * (count - 1));
      i = Math.max(0, Math.min(count - 1, i));
      setState({ i: i, offset: ev.clientX - r.left });
    }, [vbWidth, left, plotWidth, count]);
    return [ref, state, onMove, () => setState(null)];
  }

  /* ---------- header + tiles ---------- */

  function Header() {
    const s = D.site;
    return h("header", null,
      h("div", null,
        h("h1", null, "GramUrja Operations Board"),
        h("div", { className: "sub" },
          s.name + " · " + s.latitude + "°N " + s.longitude + "°E · calendar " +
          s.year + " · 8,760 simulated hours")),
      h("div", { className: "spec" },
        h("span", null, "Solar ", h("b", null, s.solar_kwp + " kWp")),
        h("span", null, "Battery ", h("b", null, s.battery_kwh + " kWh")),
        h("span", null, "Wind ", h("b", null, s.wind_kw + " kW"))));
  }

  function Tiles() {
    const q = D.kpis.status_quo, o = D.kpis.optimiser;
    const items = [
      ["Diesel burned", fmt(o.diesel_litres), "L/yr", "from " + fmt(q.diesel_litres) + " L",
       fmt(100 * (q.diesel_litres - o.diesel_litres) / q.diesel_litres) + "% less"],
      ["Energy cost", "₹" + fmt(o.energy_cost_inr), "/yr", "from ₹" + fmt(q.energy_cost_inr),
       "₹" + fmt(q.energy_cost_inr - o.energy_cost_inr) + " saved"],
      ["Supply reliability", fmt(o.reliability_pct, 1), "%", "from " + fmt(q.reliability_pct, 1) + "%",
       fmt(q.unmet_kwh) + " kWh shortfall removed"],
      ["Emissions", fmt(o.co2_kg), "kg CO2", "from " + fmt(q.co2_kg) + " kg",
       fmt(100 * (q.co2_kg - o.co2_kg) / q.co2_kg, 1) + "% less"]
    ];
    return h("div", { className: "tiles" }, items.map((t) =>
      h("div", { className: "tile", key: t[0] },
        h("div", { className: "lab" }, t[0]),
        h("div", { className: "big" }, t[1], " ", h("span", null, t[2])),
        h("div", { className: "sub2" }, t[3], " · ", h("b", null, t[4])))));
  }

  function Legend() {
    return h("div", { className: "legend" },
      SERIES.map((s) => h("span", { className: "lg", key: s.key },
        h("i", { className: "sw", style: { background: "var(" + s.v + ")" } }), s.label)),
      h("span", { className: "lg" },
        h("i", { className: "sw", style: { background: "var(--ink)", height: "2px", borderRadius: "1px" } }),
        "Demand"));
  }

  /* ---------- dispatch ---------- */

  function DispatchChart() {
    const VB = 980, L = 64, R = 14, T = 40, B = 30;
    const w = VB - L - R, hgt = 360 - T - B;
    const [ref, hov, onMove, onLeave] = usePointerIndex(VB, L, w, N);

    const geo = useMemo(() => {
      let peak = 0;
      for (let i = 0; i < N; i++) {
        let sum = 0;
        for (const s of SERIES) sum += W[s.key][i];
        peak = Math.max(peak, sum, W.load_kw[i]);
      }
      const yMax = Math.ceil(peak);
      const X = (i) => L + (i / (N - 1)) * w;
      const Y = (v) => T + hgt - (v / yMax) * hgt;
      const base = new Array(N).fill(0);
      const bands = SERIES.map((s) => {
        const top = base.map((b, i) => b + W[s.key][i]);
        let d = "M " + X(0) + " " + Y(base[0]);
        for (let i = 0; i < N; i++) d += " L " + X(i) + " " + Y(top[i]);
        for (let i = N - 1; i >= 0; i--) d += " L " + X(i) + " " + Y(base[i]);
        for (let i = 0; i < N; i++) base[i] = top[i];
        return { d: d + " Z", v: s.v, key: s.key };
      });
      let load = "M " + X(0) + " " + Y(W.load_kw[0]);
      for (let i = 1; i < N; i++) load += " L " + X(i) + " " + Y(W.load_kw[i]);
      const step = Math.max(1, Math.round(yMax / 4));
      const grid = [];
      for (let g = 0; g <= yMax; g += step) grid.push(g);
      return { yMax, X, Y, bands, load, grid };
    }, []);

    const strips = [["ag_available", "--s-ag", "AG", 8], ["village_available", "--s-village", "VILLAGE", 22]];

    return h("div", { className: "chartbox" },
      h("svg", {
        className: "chart", viewBox: "0 0 " + VB + " 360", ref: ref,
        onPointerMove: onMove, onPointerLeave: onLeave,
        role: "img", "aria-label": "Stacked hourly dispatch by source across one week, with feeder availability strips"
      },
        geo.grid.map((g) => h(Fragment, { key: "g" + g },
          h("line", { x1: L, y1: geo.Y(g), x2: L + w, y2: geo.Y(g), className: "gridline" }),
          h("text", { x: L - 7, y: geo.Y(g) + 3.5, className: "tick", textAnchor: "end" }, g))),
        h("text", { x: 13, y: T + hgt / 2, className: "alab", textAnchor: "middle",
                    transform: "rotate(-90 13 " + (T + hgt / 2) + ")" }, "kW"),

        strips.map(([k, v, name, y]) => h(Fragment, { key: k },
          W[k].map((on, i) => on ? h("rect", {
            key: i, x: geo.X(i), y: y, width: Math.max(1, w / (N - 1)), height: 7,
            fill: "var(" + v + ")", opacity: 0.85
          }) : null),
          h("text", { x: L - 7, y: y + 6.5, className: "alab", textAnchor: "end" }, name))),

        geo.bands.map((b) => h("path", {
          key: b.key, d: b.d, fill: "var(" + b.v + ")",
          stroke: "var(--surface-2)", strokeWidth: 2
        })),
        h("path", { d: geo.load, fill: "none", stroke: "var(--ink)", strokeWidth: 2, opacity: 0.72 }),
        h("line", { x1: L, y1: T + hgt, x2: L + w, y2: T + hgt, className: "axis" }),

        [0, 1, 2, 3, 4, 5, 6].map((day) => h(Fragment, { key: "d" + day },
          day > 0 && h("line", { x1: geo.X(day * 24), y1: T, x2: geo.X(day * 24), y2: T + hgt, className: "gridline" }),
          h("text", { x: geo.X(day * 24), y: T + hgt + 17, className: "tick", textAnchor: "middle" },
            "day " + (D.week.start_day + day)))),

        hov && h("line", { x1: geo.X(hov.i), y1: T, x2: geo.X(hov.i), y2: T + hgt,
                           stroke: "var(--ink-3)", strokeWidth: 1, opacity: 0.55 })),

      hov && h(Tip, { at: { left: Math.max(0, Math.min(hov.offset + 14, 800)), top: 52 } },
        h("div", { className: "th" }, stamp(hov.i)),
        SERIES.filter((s) => W[s.key][hov.i] > 0.005).map((s) =>
          h(Row, { key: s.key, swatch: s.v, name: s.label, value: W[s.key][hov.i].toFixed(2) })),
        h("div", { className: "r", style: { marginTop: 4, borderTop: "1px solid var(--rule)", paddingTop: 4 } },
          h("span", null, "Demand"), h("span", { className: "v" }, W.load_kw[hov.i].toFixed(2) + " kW"))));
  }

  /* ---------- battery ---------- */

  function SocChart() {
    const VB = 980, L = 64, R = 14, T = 16, B = 28;
    const w = VB - L - R, hgt = 200 - T - B;
    const [ref, hov, onMove, onLeave] = usePointerIndex(VB, L, w, N);
    const X = (i) => L + (i / (N - 1)) * w;
    const Y = (v) => T + hgt - v * hgt;
    const line = useMemo(() => {
      let d = "M " + X(0) + " " + Y(W.soc[0]);
      for (let i = 1; i < N; i++) d += " L " + X(i) + " " + Y(W.soc[i]);
      return d;
    }, []);

    return h("div", { className: "chartbox" },
      h("svg", {
        className: "chart", viewBox: "0 0 " + VB + " 200", ref: ref,
        onPointerMove: onMove, onPointerLeave: onLeave,
        role: "img", "aria-label": "Battery state of charge across the week against the 20 percent reserve floor"
      },
        [0, 0.25, 0.5, 0.75, 1].map((g) => h(Fragment, { key: g },
          h("line", { x1: L, y1: Y(g), x2: L + w, y2: Y(g), className: "gridline" }),
          h("text", { x: L - 7, y: Y(g) + 3.5, className: "tick", textAnchor: "end" }, Math.round(g * 100) + "%"))),
        h("path", { d: line + " L " + X(N - 1) + " " + Y(0) + " L " + X(0) + " " + Y(0) + " Z",
                    fill: "var(--s-batt)", opacity: 0.13 }),
        h("path", { d: line, fill: "none", stroke: "var(--s-batt)", strokeWidth: 2 }),
        h("line", { x1: L, y1: Y(0.2), x2: L + w, y2: Y(0.2), stroke: "var(--warn)",
                    strokeWidth: 1.5, strokeDasharray: "5 4" }),
        h("text", { x: L + 6, y: Y(0.2) - 6, className: "dlab", fill: "var(--warn)" }, "20% reserve floor"),
        h("line", { x1: L, y1: T + hgt, x2: L + w, y2: T + hgt, className: "axis" }),
        [0, 1, 2, 3, 4, 5, 6].map((day) =>
          h("text", { key: day, x: X(day * 24), y: T + hgt + 16, className: "tick", textAnchor: "middle" },
            "day " + (D.week.start_day + day))),
        hov && h("circle", { cx: X(hov.i), cy: Y(W.soc[hov.i]), r: 4.5, fill: "var(--s-batt)",
                             stroke: "var(--surface-2)", strokeWidth: 2 })),

      hov && h(Tip, { at: { left: Math.max(0, Math.min(hov.offset + 14, 800)), top: 10 } },
        h("div", { className: "th" }, stamp(hov.i)),
        h(Row, { name: "State of charge", value: (W.soc[hov.i] * 100).toFixed(0) + "%" }),
        h(Row, { name: "Charging", value: W.charge_kw[hov.i].toFixed(2) + " kW" }),
        h(Row, { name: "Discharging", value: W.discharge_kw[hov.i].toFixed(2) + " kW" })));
  }

  /* ---------- irrigation windows ---------- */

  function WindowBars() {
    const opts = D.advice.options;
    const VB = 480, L = 48, R = 12, T = 16, B = 42;
    const w = VB - L - R, hgt = 300 - T - B;
    const [hov, setHov] = useState(null);
    const lo = Math.min.apply(null, opts.map((o) => o.cost_inr));
    const hi = Math.max.apply(null, opts.map((o) => o.cost_inr));
    const yMin = Math.floor(lo * 0.94), yMax = Math.ceil(hi * 1.02);
    const Y = (v) => T + hgt - ((v - yMin) / (yMax - yMin)) * hgt;
    const bw = w / opts.length;

    return h("div", { className: "chartbox" },
      h("svg", { className: "chart", viewBox: "0 0 " + VB + " 300", role: "img",
                 "aria-label": "Daily energy cost for each candidate irrigation start hour" },
        [0, 1, 2, 3].map((k) => {
          const v = yMin + (yMax - yMin) * k / 3;
          return h(Fragment, { key: k },
            h("line", { x1: L, y1: Y(v), x2: L + w, y2: Y(v), className: "gridline" }),
            h("text", { x: L - 7, y: Y(v) + 3.5, className: "tick", textAnchor: "end" }, Math.round(v)));
        }),
        h("text", { x: 13, y: T + hgt / 2, className: "alab", textAnchor: "middle",
                    transform: "rotate(-90 13 " + (T + hgt / 2) + ")" }, "INR for the day"),
        opts.map((o, i) => {
          const best = o.start_hour === D.advice.best_start;
          const x = L + i * bw + 2.5;
          return h(Fragment, { key: o.start_hour },
            h("rect", {
              x: x, y: Y(o.cost_inr), width: bw - 5, height: Math.max(2, T + hgt - Y(o.cost_inr)), rx: 4,
              fill: best ? "var(--accent)" : "var(--s-ag)",
              opacity: best ? 1 : (hov === i ? 0.78 : 0.5),
              onPointerEnter: () => setHov(i), onPointerLeave: () => setHov(null)
            }),
            (i % 2 === 0 || best) && h("text", { x: x + (bw - 5) / 2, y: T + hgt + 15,
              className: "tick", textAnchor: "middle" }, pad(o.start_hour)),
            best && h("text", { x: x + (bw - 5) / 2, y: Y(o.cost_inr) - 7, className: "dlab",
              fill: "var(--accent)", textAnchor: "middle" }, "₹" + Math.round(o.cost_inr)));
        }),
        h("line", { x1: L, y1: T + hgt, x2: L + w, y2: T + hgt, className: "axis" }),
        h("text", { x: L + w / 2, y: 292, className: "alab", textAnchor: "middle" }, "PUMP START HOUR")),

      hov !== null && h(Tip, { at: { left: 14, top: 10 } },
        h("div", { className: "th" }, "Start " + pad(opts[hov].start_hour) + ":00"),
        h(Row, { name: "Day cost", value: "₹" + opts[hov].cost_inr.toFixed(1) }),
        h(Row, { name: "Diesel", value: opts[hov].diesel_litres.toFixed(2) + " L" }),
        opts[hov].start_hour === D.advice.best_start &&
          h("div", { className: "r", style: { color: "var(--accent)", marginTop: 3 } }, "recommended")));
  }

  /* ---------- carbon curve ---------- */

  function CarbonCurve() {
    const c = D.carbon_curve;
    const VB = 480, L = 48, R = 12, T = 16, B = 42;
    const w = VB - L - R, hgt = 300 - T - B;
    const [ref, hov, onMove, onLeave] = usePointerIndex(VB, L, w, c.length);
    const lo = Math.min.apply(null, c), hi = Math.max.apply(null, c);
    const yMin = Math.floor(lo * 20) / 20 - 0.05, yMax = Math.ceil(hi * 20) / 20 + 0.05;
    const X = (i) => L + (i / (c.length - 1)) * w;
    const Y = (v) => T + hgt - ((v - yMin) / (yMax - yMin)) * hgt;
    let d = "M " + X(0) + " " + Y(c[0]);
    for (let i = 1; i < c.length; i++) d += " L " + X(i) + " " + Y(c[i]);
    const loI = c.indexOf(lo), hiI = c.indexOf(hi);

    return h("div", { className: "chartbox" },
      h("svg", { className: "chart", viewBox: "0 0 " + VB + " 300", ref: ref,
                 onPointerMove: onMove, onPointerLeave: onLeave, role: "img",
                 "aria-label": "Grid carbon intensity by hour of day, from a midday trough to an evening peak" },
        [0, 1, 2, 3].map((k) => {
          const v = yMin + (yMax - yMin) * k / 3;
          return h(Fragment, { key: k },
            h("line", { x1: L, y1: Y(v), x2: L + w, y2: Y(v), className: "gridline" }),
            h("text", { x: L - 7, y: Y(v) + 3.5, className: "tick", textAnchor: "end" }, v.toFixed(2)));
        }),
        h("path", { d: d + " L " + X(c.length - 1) + " " + Y(yMin) + " L " + X(0) + " " + Y(yMin) + " Z",
                    fill: "var(--s-diesel)", opacity: 0.12 }),
        h("path", { d: d, fill: "none", stroke: "var(--s-diesel)", strokeWidth: 2 }),
        [[loI, lo, "cleanest"], [hiI, hi, "dirtiest"]].map(([i, v, name]) => h(Fragment, { key: name },
          h("circle", { cx: X(i), cy: Y(v), r: 4.5, fill: "var(--s-diesel)",
                        stroke: "var(--surface-2)", strokeWidth: 2 }),
          h("text", { x: X(i), y: Y(v) - 10, className: "dlab", fill: "var(--ink-2)",
                      textAnchor: i > c.length / 2 ? "end" : "start" },
            name + " " + v.toFixed(3) + " @ " + pad(i) + ":00"))),
        h("line", { x1: L, y1: T + hgt, x2: L + w, y2: T + hgt, className: "axis" }),
        [0, 6, 12, 18, 23].map((i) =>
          h("text", { key: i, x: X(i), y: T + hgt + 15, className: "tick", textAnchor: "middle" }, pad(i))),
        h("text", { x: L + w / 2, y: 292, className: "alab", textAnchor: "middle" }, "HOUR OF DAY"),
        hov && h("circle", { cx: X(hov.i), cy: Y(c[hov.i]), r: 4, fill: "var(--ink)",
                             stroke: "var(--surface-2)", strokeWidth: 2 })),

      hov && h(Tip, { at: { left: Math.max(0, Math.min(hov.offset + 14, 300)), top: 10 } },
        h("div", { className: "th" }, pad(hov.i) + ":00"),
        h(Row, { name: "Grid intensity", value: c[hov.i].toFixed(3) + " kg/kWh" })));
  }

  /* ---------- tables ---------- */

  function KpiTable() {
    const rows = [
      ["Diesel", "diesel_litres", " L", 1, false],
      ["Energy cost", "energy_cost_inr", "", 0, true],
      ["Reliability", "reliability_pct", "%", 2, false],
      ["Unserved load", "unmet_kwh", " kWh", 1, false],
      ["Grid import", "grid_kwh", " kWh", 0, false],
      ["Renewable share", "renewable_pct", "%", 1, false],
      ["CO2", "co2_kg", " kg", 0, false]
    ];
    const cols = [["status_quo", "Status quo"], ["rules", "Rule-based"], ["optimiser", "Optimiser"]];
    return h("table", null,
      h("thead", null, h("tr", null, h("th", null, "Metric"),
        cols.map((c) => h("th", { className: "n", key: c[0] }, c[1])))),
      h("tbody", null, rows.map((r) =>
        h("tr", { key: r[1], className: r[1] === "energy_cost_inr" ? "hi" : undefined },
          h("td", null, r[0]),
          cols.map((c) => h("td", { className: "n", key: c[0] },
            (r[4] ? "₹" : "") + fmt(D.kpis[c[0]][r[1]], r[3]) + r[2]))))));
  }

  function WeekTable() {
    const head = ["Hour", "Demand", "Solar", "Ag feeder", "Village", "Battery", "Diesel", "SOC"];
    const keys = ["load_kw", "solar_kw", "ag_kw", "village_kw", "discharge_kw", "diesel_kw"];
    return h("details", null,
      h("summary", null, "Show the hourly numbers as a table"),
      h("div", { className: "tabscroll" },
        h("table", null,
          h("thead", null, h("tr", null, head.map((x, i) =>
            h("th", { key: x, className: i ? "n" : undefined }, x)))),
          h("tbody", null, W.hour.map((_, i) =>
            h("tr", { key: i },
              h("td", { className: "n" }, "d" + dayOf(i) + " " + pad(i % 24) + ":00"),
              keys.map((k) => h("td", { className: "n", key: k }, W[k][i].toFixed(2))),
              h("td", { className: "n" }, (W.soc[i] * 100).toFixed(0) + "%")))))));
  }

  /* ---------- app ---------- */

  function App() {
    return h("div", { className: "wrap" },
      h(Header),
      h(Tiles),
      h(Panel, {
        title: "Where every hour's energy came from",
        note: "days " + D.week.start_day + "–" + (D.week.start_day + 6) + " · 168 hours",
        desc: "One week of dispatch decided by the optimiser. The strips above the plot show when each " +
              "grid connection was actually available (AG = agricultural feeder, VILLAGE = domestic) — " +
              "note how the battery carries the load through the gaps, and how little diesel is left."
      }, h(Legend), h(DispatchChart), h(WeekTable)),
      h(Panel, {
        title: "Battery state of charge",
        note: "same week · 20% reserve floor held",
        desc: "The reserve floor is a hard constraint, not a guideline: the optimiser may plan down to it " +
              "but never through it."
      }, h(SocChart)),
      h("div", { className: "two" },
        h(Panel, {
          title: "When to run the pump", note: "cost by start hour",
          desc: "Each bar is a full re-simulation with the pump moved to that hour, so the recommendation " +
                "is a measured result rather than a rule of thumb."
        }, h(WindowBars)),
        h(Panel, {
          title: "Grid carbon through the day", note: "kg CO2 per kWh",
          desc: "Utility solar pushes the midday trough down; the post-sunset peak is met by the dirtiest " +
                "plant on the system. That spread is the only reason storage can cut emissions at all."
        }, h(CarbonCurve))),
      h(Panel, {
        title: "Today's advice", note: "assembled from the optimiser, no language model"
      }, h("div", { className: "brief" },
        h("ul", null, D.advice.briefing.map((b, i) => h("li", { key: i }, b))))),
      h(Panel, {
        title: "Controller comparison",
        note: "same hardware · energy cost only, excludes annualised capital"
      }, h(KpiTable)),
      h("footer", null, "Every figure on this page is output from the model, not illustration. " +
        "Demand profile, capital costs and tariffs are modelled assumptions."));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
